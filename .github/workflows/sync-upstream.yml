name: Sync upstream prompt corpus
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/asgeirtj/system_prompts_leaks.git
          git fetch upstream main
      - name: Fast-forward mirror
        run: |
          git checkout main
          git merge --ff-only upstream/main
      - name: Publish mirror
        run: git push origin main
